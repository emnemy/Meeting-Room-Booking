<body>
<div id="app"></div>
<script>
// ── Constants ──────────────────────────────────────────────────────────────
const ROOMS=["พนาลัย","ไพรวัณ","ห้องอาหารจันทร์ลอย","เทอเรสสระว่ายน้ำ"];
const RC=["#8B5E3C","#4A7C59","#C4862A","#2A6B8B"];
const RL=["#FDF6EE","#EEF6F1","#FEF8ED","#EEF4F8"];
const SB=["#8B5E3C","#C4862A","#2A6B8B"];
const MTH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MSH=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const DTH=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
const DSH=["อา","จ","อ","พ","พฤ","ศ","ส"];
const DC={0:"#B91C1C",6:"#1D4ED8"};
const BY=2569,CY=2026,MAX=3;
const ES={customerName:"",eventName:"",timeStart:"",timeEnd:"",pax:"",note:""};
const eSlots=()=>[{...ES},{...ES},{...ES}];

const GAS_CODE=`const SHEET_NAME = "RoomBookings";

function getSheet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(["key", "value", "updatedAt"]);
    sheet.setFrozenRows(1);
  }
  return sheet;
}

function doGet(e) {
  const action = e.parameter.action || "";
  const sheet = getSheet();
  try {
    if (action === "getAll") {
      const prefix = e.parameter.prefix || "";
      const data = sheet.getDataRange().getValues();
      const result = {};
      data.slice(1)
        .filter(row => row[0] && String(row[0]).startsWith(prefix))
        .forEach(row => { result[String(row[0])] = row[1]; });
      return respond(result);
    }
    if (action === "set") {
      const key = e.parameter.key;
      const value = e.parameter.value;
      const data = sheet.getDataRange().getValues();
      const idx = data.slice(1).findIndex(r => String(r[0]) === key);
      if (idx >= 0) {
        sheet.getRange(idx+2,2,1,2).setValues([[value, new Date().toISOString()]]);
      } else {
        sheet.appendRow([key, value, new Date().toISOString()]);
      }
      return respond({ ok: true });
    }
    if (action === "delete") {
      const key = e.parameter.key;
      const data = sheet.getDataRange().getValues();
      const idx = data.slice(1).findIndex(r => String(r[0]) === key);
      if (idx >= 0) sheet.deleteRow(idx + 2);
      return respond({ ok: true });
    }
    return respond({ error: "Unknown action" });
  } catch(err) {
    return respond({ error: err.toString() });
  }
}

function respond(data) {
  return ContentService
    .createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}`;

// ── Helpers ────────────────────────────────────────────────────────────────
function dim(m){return new Date(CY,m+1,0).getDate();}
function dow(m,d){return new Date(CY,m,d).getDay();}
function bKey(m,d,r){return `bk-${BY}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}-${r}`;}
function ok(s){return s&&s.customerName&&s.customerName.trim()!=="";}
function norm(raw){
  if(!raw)return eSlots();
  try{
    const p=typeof raw==="string"?JSON.parse(raw):raw;
    if(Array.isArray(p)){const a=p.map(s=>({...ES,...s}));while(a.length<MAX)a.push({...ES});return a;}
    return [{...ES,...p},{...ES},{...ES}];
  }catch{return eSlots();}
}

// ── State ──────────────────────────────────────────────────────────────────
let S={
  gasUrl: localStorage.getItem("gasUrl")||"",
  month: new Date().getMonth(),
  bookings:{}, loading:false,
  modal:null, slots:eSlots(), activeSlot:0, saving:false,
  viewMode:"table", showSettings:false, deleteConfirm:false,
  testing:false, testResult:null,
  setupStep:1, copied:false
};
function ss(p){Object.assign(S,p);render();}

// ── API ────────────────────────────────────────────────────────────────────
async function apiCall(params){
  const qs=new URLSearchParams(params).toString();
  const res=await fetch(S.gasUrl+"?"+qs,{redirect:"follow"});
  return res.json();
}
async function loadBk(){
  if(!S.gasUrl)return;
  ss({loading:true});
  try{
    const raw=await apiCall({action:"getAll",prefix:`bk-${BY}-`});
    const b={};
    for(const[k,v]of Object.entries(raw)){try{b[k]=norm(v);}catch{}}
    ss({bookings:b,loading:false});
  }catch(e){toast("โหลดข้อมูลไม่สำเร็จ: "+e.message,"err");ss({loading:false});}
}

function toast(msg,type){
  const t=document.createElement("div");
  t.className="toast";
  t.style.background=type==="err"?"#EF4444":"#16A34A";
  t.textContent=(type==="err"?"⚠️ ":"✅ ")+msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

// ── Setup actions ──────────────────────────────────────────────────────────
function goConnect(){
  const inp=document.getElementById("urlInput");
  const url=inp?inp.value.trim():"";
  if(!url){inp&&inp.focus();return;}
  S.gasUrl=url;
  ss({testing:true,testResult:null});
  apiCall({action:"getAll",prefix:"test-"}).then(res=>{
    if(typeof res==="object"&&!res.error){
      localStorage.setItem("gasUrl",S.gasUrl);
      ss({testing:false,testResult:"ok"});
      setTimeout(()=>loadBk(),900);
    }else{
      S.gasUrl="";
      ss({testing:false,testResult:"error: "+(res.error||"เชื่อมต่อไม่ได้")});
    }
  }).catch(e=>{
    S.gasUrl="";
    ss({testing:false,testResult:"error: "+e.message});
  });
}
function resetUrl(){localStorage.removeItem("gasUrl");ss({gasUrl:"",bookings:{},showSettings:false,setupStep:1});}
async function copyCode(){
  try{await navigator.clipboard.writeText(GAS_CODE);ss({copied:true});setTimeout(()=>ss({copied:false}),2000);}
  catch{alert("ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาเลือกโค้ดแล้ว Ctrl+C ครับ");}
}

// ── Booking actions ────────────────────────────────────────────────────────
function openModal(day,room){
  const key=bKey(S.month,day,room);
  const slots=norm(S.bookings[key]||null);
  const fe=slots.findIndex(s=>!ok(s));
  ss({modal:{day,room,key},slots,activeSlot:fe>=0?fe:0,deleteConfirm:false});
}
function closeModal(){ss({modal:null,slots:eSlots(),deleteConfirm:false});}

function updField(field,val){
  const sl=[...S.slots];
  sl[S.activeSlot]={...sl[S.activeSlot],[field]:val};
  ss({slots:sl});
}
async function saveBk(){
  if(!S.slots.some(ok)){toast("กรุณากรอกชื่อลูกค้าอย่างน้อย 1 รายการ","err");return;}
  ss({saving:true});
  try{
    await apiCall({action:"set",key:S.modal.key,value:JSON.stringify(S.slots)});
    const b={...S.bookings,[S.modal.key]:[...S.slots]};
    toast(`บันทึกเรียบร้อย (${S.slots.filter(ok).length} รายการ)`);
    ss({bookings:b,saving:false});closeModal();
  }catch(e){toast("บันทึกไม่สำเร็จ: "+e.message,"err");ss({saving:false});}
}
async function clearSlot(){
  const sl=S.slots.map((s,i)=>i===S.activeSlot?{...ES}:s);
  ss({slots:sl,deleteConfirm:false});
  if(sl.every(s=>!ok(s))){
    try{
      await apiCall({action:"delete",key:S.modal.key});
      const b={...S.bookings};delete b[S.modal.key];
      toast("ลบข้อมูลเรียบร้อย");ss({bookings:b});closeModal();
    }catch(e){toast("ลบไม่สำเร็จ: "+e.message,"err");}
  }
}

// ── DOM Builder ────────────────────────────────────────────────────────────
function mk(tag,cls,style,children,events){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(style)Object.assign(e.style,style);
  for(const[ev,fn]of Object.entries(events||{}))e.addEventListener(ev,fn);
  for(const c of(children||[])){
    if(c==null||c===false)continue;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return e;
}
const D=(cls,style,ch,ev)=>mk("div",cls,style,ch,ev);
const B=(cls,style,ch,ev)=>mk("button",cls,style,ch,ev);
const Sp=(cls,style,ch)=>mk("span",cls,style,ch);
const T=(tag,cls,style,ch)=>mk(tag,cls,style,ch);

// ── Setup Render ───────────────────────────────────────────────────────────
function renderSetup(){
  const s=S;
  const dotStyle=(n)=>({background:s.setupStep>=n?"#6B3A2A":"#E5DDD5",color:s.setupStep>=n?"#fff":"#AAA"});

  // Step content
  let body;
  if(s.setupStep===1){
    body=D("",{},[
      T("h2","",{color:"#3D2B1F",fontSize:"18px",marginBottom:"8px"},["ขั้นตอนที่ 1: สร้าง Google Sheet"]),
      D("",{color:"#666",fontSize:"14px",lineHeight:"1.8",marginBottom:"16px"},[
        "1. เปิด ",mk("a","",{color:"#6B3A2A",fontWeight:"600"},[" sheets.google.com "],{click:()=>window.open("https://sheets.google.com","_blank")}),
        " แล้วสร้าง Spreadsheet ใหม่",mk("br"),
        "2. ตั้งชื่อตามต้องการ เช่น ",mk("strong","",{},["\"ตารางจองห้อง 2569\""]),mk("br"),
        "3. คลิก ",mk("strong","",{},["Extensions → Apps Script"]),mk("br"),
        "4. ลบโค้ดเดิมออกทั้งหมด แล้วไปขั้นตอนถัดไป"
      ]),
      D("",{display:"flex",gap:"10px"},[
        mk("a","btn btn-save",{background:"#4A7C59",display:"inline-block",textDecoration:"none"},["📊 เปิด Google Sheets"],{click:()=>window.open("https://sheets.google.com/create","_blank")}),
        B("btn btn-save",{background:"#6B3A2A"},["ถัดไป →"],{click:()=>ss({setupStep:2})})
      ])
    ]);
  } else if(s.setupStep===2){
    body=D("",{},[
      T("h2","",{color:"#3D2B1F",fontSize:"18px",marginBottom:"8px"},["ขั้นตอนที่ 2: วาง Script และ Deploy"]),
      D("",{color:"#666",fontSize:"14px",lineHeight:"1.8",marginBottom:"12px"},[
        "1. คัดลอกโค้ดด้านล่าง → วางใน Apps Script ทับโค้ดเดิม",mk("br"),
        "2. กด ",mk("strong","",{},["Save (Ctrl+S)"]),mk("br"),
        "3. คลิก ",mk("strong","",{},["Run → getSheet"])," เพื่อ Authorize (สำคัญ!)",mk("br"),
        "4. คลิก ",mk("strong","",{},["Deploy → New deployment → Web app"]),mk("br"),
        "5. Execute as: ",mk("strong","",{},["Me"])," · Who has access: ",mk("strong","",{},["Anyone"]),mk("br"),
        "6. กด Deploy แล้วคัดลอก URL ที่ขึ้นมา"
      ]),
      mk("pre","codeblock",{},[GAS_CODE]),
      B("copybtn",{marginTop:"8px",background:s.copied?"#4A7C59":"#45475A"},
        [s.copied?"✓ คัดลอกแล้ว!":"📋 คัดลอกโค้ด"],{click:copyCode}),
      D("",{display:"flex",gap:"10px",marginTop:"16px"},[
        B("btn btn-cancel",{},["← ย้อนกลับ"],{click:()=>ss({setupStep:1})}),
        B("btn btn-save",{background:"#6B3A2A"},["Deploy แล้ว ถัดไป →"],{click:()=>ss({setupStep:3})})
      ])
    ]);
  } else {
    // Step 3 — No re-render on typing, read from DOM directly
    const inp=mk("input","url-input",{});
    inp.id="urlInput";
    inp.type="text";
    inp.placeholder="https://script.google.com/macros/s/.../exec";
    inp.value=S.gasUrl||"";

    const trEl=s.testResult?D("tres",{
      background:s.testResult==="ok"?"#DCFCE7":"#FEE2E2",
      color:s.testResult==="ok"?"#16A34A":"#DC2626",
      marginBottom:"10px"
    },[(s.testResult==="ok"?"✅ เชื่อมต่อสำเร็จ! กำลังเปิดโปรแกรม...":"⚠️ "+s.testResult)]):null;

    const connBtn=B("connect-btn",{background:s.testing?"#AAA":"#6B3A2A"},
      [s.testing?"⏳ กำลังทดสอบการเชื่อมต่อ...":"🔗 ทดสอบและเชื่อมต่อ"],
      {click:goConnect});

    body=D("",{},[
      T("h2","",{color:"#3D2B1F",fontSize:"18px",marginBottom:"8px"},["ขั้นตอนที่ 3: ใส่ Web App URL"]),
      D("",{color:"#666",fontSize:"14px",marginBottom:"16px"},["วาง URL ที่ได้จาก Deploy Apps Script ด้านล่าง (ต้องลงท้ายด้วย /exec)"]),
      T("label","",{display:"block",fontSize:"13px",fontWeight:"600",color:"#6B3A2A",marginBottom:"6px"},["Web App URL"]),
      inp,
      trEl,
      connBtn,
      D("",{marginTop:"10px"},[
        B("btn btn-cancel",{},["← ย้อนกลับ"],{click:()=>ss({setupStep:2})})
      ])
    ]);
  }

  return D("setup",{},[
    D("",{width:"100%",maxWidth:"620px"},[
      D("",{textAlign:"center",marginBottom:"32px"},[
        D("",{fontSize:"40px",marginBottom:"8px"},["🗓️"]),
        T("h1","",{fontFamily:"'Playfair Display',serif",color:"#3D2B1F",fontSize:"24px"},["ตั้งค่าระบบจองห้องประชุม"]),
        D("",{color:"#888",marginTop:"8px",fontSize:"15px"},["เชื่อมต่อกับ Google Sheets เพื่อให้ข้อมูลซิงค์ได้จากทุกอุปกรณ์"])
      ]),
      // Step bar
      D("stepbar",{},[
        D("sdot",dotStyle(1),["1"]),
        D("sline",{background:s.setupStep>1?"#6B3A2A":"#E5DDD5"}),
        D("sdot",dotStyle(2),["2"]),
        D("sline",{background:s.setupStep>2?"#6B3A2A":"#E5DDD5"}),
        D("sdot",dotStyle(3),["3"])
      ]),
      D("setup-card",{},[body]),
      D("",{textAlign:"center",color:"#BBB",fontSize:"12px",marginTop:"16px"},["ตั้งค่าครั้งเดียว ข้อมูลซิงค์ทุกอุปกรณ์ผ่าน Google Sheets ของคุณ"])
    ])
  ]);
}

// ── App Render ─────────────────────────────────────────────────────────────
function renderApp(){
  const s=S;
  const days=dim(s.month);
  const mc=ROOMS.map(room=>{
    let c=0;
    for(let d=1;d<=days;d++){const b=s.bookings[bKey(s.month,d,room)];if(b&&b.some(ok))c++;}
    return c;
  });

  const header=D("header",{},[
    D("hinner",{},[
      D("htop",{},[
        D("",{},[
          D("hsub",{},["ระบบจองห้องประชุม · Google Sheets"]),
          T("h1","htitle",{},[`ตารางรับจองห้องประชุม พ.ศ. ${BY}`])
        ]),
        D("hbtns",{},[
          B("hbtn "+(s.viewMode==="table"?"act":"inact"),{},["📅 ตาราง"],{click:()=>ss({viewMode:"table"})}),
          B("hbtn "+(s.viewMode==="list"?"act":"inact"),{},["📋 รายการ"],{click:()=>ss({viewMode:"list"})}),
          B("hbtn out",{},["⚙️ ตั้งค่า"],{click:()=>ss({showSettings:true})})
        ])
      ]),
      D("pills",{},ROOMS.map((r,i)=>
        D("pill",{borderLeft:`3px solid ${RC[i]}`},[
          D("pill-n",{},[r]),
          D("pill-c",{},[`จอง ${mc[i]} วัน`])
        ])
      ))
    ])
  ]);

  const mtabs=D("mtabs",{},[
    D("mtabs-in",{},MSH.map((m,i)=>
      B("mtab"+(s.month===i?" act":""),{},{},
        [m],{click:()=>{ss({month:i});setTimeout(loadBk,50);}})
    ))
  ]);

  let content;
  if(s.loading){
    content=D("",{textAlign:"center",padding:"60px",color:"#999"},[
      D("",{fontSize:"28px",marginBottom:"8px"},["⏳"]),
      "กำลังโหลดข้อมูลจาก Google Sheets..."
    ]);
  } else if(s.viewMode==="table"){
    content=renderTable(s,days);
  } else {
    content=renderList(s,days);
  }

  const main=D("main",{},[
    D("main-top",{},[
      T("h2","main-ttl",{},[`${MTH[s.month]} ${BY}`]),
      D("main-hint",{},["คลิกช่องเพื่อเพิ่ม/แก้ไขการจอง · สูงสุด 3 รายการ/ห้อง/วัน"])
    ]),
    content
  ]);

  const modal=s.modal?renderModal(s):null;
  const settings=s.showSettings?renderSettings():null;
  return D("",{},[header,mtabs,main,modal,settings].filter(Boolean));
}

// ── Table Render ───────────────────────────────────────────────────────────
function renderTable(s,days){
  const thead=mk("thead","",{},[
    mk("tr","",{},[
      T("th","dcol",{},["วันที่"]),
      ...ROOMS.map((r,i)=>T("th","",{borderLeft:`3px solid ${RC[i]}`},[r]))
    ])
  ]);
  const rows=[];
  for(let day=1;day<=days;day++){
    const dw=dow(s.month,day);
    const bg=dw===0?"#FFF5F5":dw===6?"#F5F8FF":day%2===0?"#FAFAF8":"#fff";
    const cells=[
      mk("td","dcell",{},[
        D("dnum",{color:DC[dw]||"#3D2B1F"},[String(day)]),
        D("dname",{color:DC[dw]||"#BBB"},[DSH[dw]])
      ])
    ];
    ROOMS.forEach((room,ri)=>{
      const bkd=s.bookings[bKey(s.month,day,room)];
      const filled=bkd?bkd.filter(ok):[];
      const cc=filled.length>0?[
        ...filled.map(sl=>{
          const oi=bkd.indexOf(sl);
          return D("scard",{background:RL[ri],borderLeft:`3px solid ${SB[oi]||RC[ri]}`},[
            D("scard-h",{},[
              Sp("sbadge",{background:SB[oi]||RC[ri]},[String(oi+1)]),
              Sp("sname",{color:RC[ri]},[sl.customerName])
            ]),
            sl.eventName?D("sevent",{},[sl.eventName]):null,
            (sl.timeStart||sl.pax)?D("stime",{},[(sl.timeStart?`🕐${sl.timeStart}${sl.timeEnd?"-"+sl.timeEnd:""}`:""),(sl.pax?` · ${sl.pax}คน`:"")]):null
          ].filter(Boolean));
        }),
        filled.length<MAX?D("mh",{},["+ เพิ่ม"]):null
      ].filter(Boolean):[D("ah",{},["+ เพิ่ม"])];

      const td=mk("td","rcell",{borderLeft:`2px solid ${RC[ri]}22`},cc,{click:()=>openModal(day,room)});
      td.addEventListener("mouseenter",()=>td.style.background=RL[ri]);
      td.addEventListener("mouseleave",()=>td.style.background="transparent");
      cells.push(td);
    });
    rows.push(mk("tr","",{background:bg},cells));
  }
  return D("twrap",{},[mk("table","",{},[thead,mk("tbody","",{},rows)])]);
}

// ── List Render ────────────────────────────────────────────────────────────
function renderList(s,days){
  const items=[];
  for(let dd=1;dd<=days;dd++){
    ROOMS.forEach((room,ri)=>{
      const bkd=s.bookings[bKey(s.month,dd,room)];
      if(bkd&&bkd.some(ok))items.push({day:dd,room,ri,bkd});
    });
  }
  if(!items.length)return D("empty",{},[D("",{fontSize:"40px",marginBottom:"12px"},["📭"]),"ยังไม่มีการจองในเดือนนี้"]);
  return D("lwrap",{},items.map(({day,room,ri,bkd})=>{
    const dw=dow(s.month,day);
    const card=D("lcard",{borderLeft:`4px solid ${RC[ri]}`},[
      D("lday",{},[
        D("ldnum",{color:DC[dw]||"#3D2B1F"},[String(day)]),
        D("ldname",{color:DC[dw]||"#999"},[DTH[dw]])
      ]),
      D("",{flex:"1"},[
        D("lrtitle",{color:RC[ri]},[`${room} · ${bkd.filter(ok).length} รายการ`]),
        D("lslots",{},bkd.map((sl,i)=>{
          if(!ok(sl))return null;
          return D("lslot",{background:RL[ri],borderLeft:`3px solid ${SB[i]}`},[
            Sp("lsbadge",{background:SB[i]},[String(i+1)]),
            D("",{},[
              D("",{fontWeight:"700",fontSize:"14px",color:"#3D2B1F"},[sl.customerName]),
              sl.eventName?D("",{color:"#666",fontSize:"12px"},[sl.eventName]):null,
              D("",{display:"flex",gap:"10px",marginTop:"2px",flexWrap:"wrap"},[
                sl.timeStart?Sp("",{fontSize:"12px",color:"#888"},[`🕐 ${sl.timeStart}${sl.timeEnd?"-"+sl.timeEnd:""}`]):null,
                sl.pax?Sp("",{fontSize:"12px",color:"#888"},[`👥 ${sl.pax} คน`]):null,
                sl.note?Sp("",{fontSize:"12px",color:"#888"},[`📝 ${sl.note}`]):null
              ].filter(Boolean))
            ])
          ].filter(Boolean));
        }).filter(Boolean))
      ])
    ],{},{click:()=>openModal(day,room)});
    card.addEventListener("mouseenter",()=>card.style.boxShadow="0 4px 16px rgba(0,0,0,.12)");
    card.addEventListener("mouseleave",()=>card.style.boxShadow="0 2px 8px rgba(0,0,0,.07)");
    return card;
  }));
}

// ── Modal Render ───────────────────────────────────────────────────────────
function renderModal(s){
  const ri=ROOMS.indexOf(s.modal.room);
  const rc=RC[ri];
  const cur=s.slots[s.activeSlot]||{...ES};
  const fc=s.slots.filter(ok).length;

  function makeField(label,fd,type,ph,multi){
    const inp=multi?mk("textarea","",{rows:"2"}):mk("input","",{type:type||"text"});
    inp.value=cur[fd]||"";
    inp.placeholder=ph||"";
    inp.addEventListener("input",e=>updField(fd,e.target.value));
    inp.addEventListener("focus",()=>inp.style.borderColor="#8B5E3C");
    inp.addEventListener("blur",()=>inp.style.borderColor="#E5DDD5");
    return D("field",{},[T("label","",{},[label]),inp]);
  }

  const tabs=s.slots.map((sl,i)=>{
    const f=ok(sl),ia=s.activeSlot===i;
    return B("stab",{
      background:ia?"#fff":"rgba(255,255,255,.2)",
      color:ia?rc:"rgba(255,255,255,.85)",fontWeight:ia?"700":"500"
    },[
      Sp("stdot",{
        background:f?(ia?SB[i]:"rgba(255,255,255,.35)"):"transparent",
        color:f?"#fff":(ia?rc:"rgba(255,255,255,.6)"),
        border:f?"none":`1.5px solid ${ia?rc+"99":"rgba(255,255,255,.5)"}`
      },[String(i+1)]),
      `รายการที่ ${i+1}`,f?" ✓":""
    ],{click:()=>ss({activeSlot:i,deleteConfirm:false})});
  });

  const sum=fc>0?D("sumbox",{},[
    D("sumttl",{},[`📋 สรุปการจองวันนี้ (${fc}/${MAX})`]),
    ...s.slots.map((sl,i)=>{
      if(!ok(sl))return null;
      return D("sumrow",{background:s.activeSlot===i?RL[ri]:"transparent"},[
        Sp("sumbadge",{background:SB[i]},[String(i+1)]),
        Sp("",{fontSize:"13px",color:"#3D2B1F",fontWeight:"600",flex:"1"},[sl.customerName]),
        sl.timeStart?Sp("",{fontSize:"11px",color:"#999"},[sl.timeStart+(sl.timeEnd?"-"+sl.timeEnd:"")]):null,
        sl.pax?Sp("",{fontSize:"11px",color:"#999"},[sl.pax+"คน"]):null
      ].filter(Boolean),{},{click:()=>ss({activeSlot:i})});
    }).filter(Boolean)
  ]):null;

  const delSec=ok(cur)?(
    !s.deleteConfirm?
      B("btn-del",{},["🗑 ลบรายการที่ "+(s.activeSlot+1)],{click:()=>ss({deleteConfirm:true})}):
      D("dconf",{},[
        Sp("",{fontSize:"12px",color:"#EF4444"},["ยืนยันลบ?"]),
        B("dconf-yes",{},["ยืนยัน"],{click:clearSlot}),
        B("dconf-no",{},["ยกเลิก"],{click:()=>ss({deleteConfirm:false})})
      ])
  ):null;

  const ov=D("overlay",{},[ 
    D("modal",{},[
      D("mhead",{background:`linear-gradient(135deg,${rc},${rc}BB)`},[
        D("mdate",{},[`${s.modal.day} ${MTH[s.month]} ${BY}`]),
        D("mroom",{},[s.modal.room]),
        D("stabs",{},tabs)
      ]),
      D("mbody",{},[
        makeField("ชื่อลูกค้า / องค์กร *","customerName","text","กรอกชื่อลูกค้าหรือองค์กร"),
        makeField("ชื่องาน / รายการ","eventName","text","เช่น ประชุมบอร์ด, สัมมนา"),
        D("frow",{},[
          makeField("เวลาเริ่ม","timeStart","time"),
          makeField("เวลาสิ้นสุด","timeEnd","time"),
          makeField("จำนวนคน","pax","number","0")
        ]),
        makeField("หมายเหตุ","note","text","ข้อมูลเพิ่มเติม",true),
        sum,
        D("mfooter",{},[
          D("",{},[delSec].filter(Boolean)),
          D("",{display:"flex",gap:"10px"},[
            B("btn btn-cancel",{},["ยกเลิก"],{click:closeModal}),
            B("btn btn-save",{background:rc,opacity:s.saving?.7:1},
              [s.saving?"⏳ กำลังบันทึก...":"💾 บันทึกทั้งหมด"],
              {click:saveBk})
          ])
        ])
      ])
    ])
  ],{},{click:(e)=>{if(e.target===ov)closeModal();}});
  return ov;
}

// ── Settings Render ────────────────────────────────────────────────────────
function renderSettings(){
  const ov=D("overlay",{},[
    D("settbox",{},[
      T("h3","",{marginBottom:"16px",color:"#3D2B1F"},["⚙️ ตั้งค่าระบบ"]),
      D("",{color:"#666",fontSize:"14px"},["ข้อมูลถูกเชื่อมต่อกับ Google Sheets แล้ว"]),
      D("",{display:"flex",gap:"10px",marginTop:"20px"},[
        B("btn btn-cancel",{flex:"1"},["ปิด"],{click:()=>ss({showSettings:false})}),
        B("btn btn-save",{flex:"1",background:"#EF4444"},["🔄 เปลี่ยน URL ใหม่"],{click:resetUrl})
      ])
    ])
  ],{},{click:(e)=>{if(e.target===ov)ss({showSettings:false});}});
  return ov;
}

// ── Main render ────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById("app");
  root.innerHTML="";
  root.appendChild(S.gasUrl?renderApp():renderSetup());
}

render();
if(S.gasUrl) loadBk();
</script>
