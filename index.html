<body>
<div id="app"></div>
<script>
const ROOMS=["พนาลัย","ไพรวัณ","ห้องอาหารจันทร์ลอย","เทอเรสสระว่ายน้ำ"];
const RC=["#8B5E3C","#4A7C59","#C4862A","#2A6B8B"];
const RL=["#FDF6EE","#EEF6F1","#FEF8ED","#EEF4F8"];
const SB=["#8B5E3C","#C4862A","#2A6B8B"];
const MTH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MSH=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const DTH=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
const DSH=["อา","จ","อ","พ","พฤ","ศ","ส"];
const DC={0:"#B91C1C",6:"#1D4ED8"};
const BY=2569,CY=2026,MS=3;
const ES={customerName:"",eventName:"",timeStart:"",timeEnd:"",pax:"",note:""};
const eSlots=()=>[{...ES},{...ES},{...ES}];

const GAS_CODE=`const SHEET_NAME = "RoomBookings";

function getSheet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(["key", "value", "updatedAt"]);
    sheet.setFrozenRows(1);
  }
  return sheet;
}

function doGet(e) {
  const action = e.parameter.action || "";
  const sheet = getSheet();
  try {
    if (action === "getAll") {
      const prefix = e.parameter.prefix || "";
      const data = sheet.getDataRange().getValues();
      const result = {};
      data.slice(1)
        .filter(row => row[0] && String(row[0]).startsWith(prefix))
        .forEach(row => { result[String(row[0])] = row[1]; });
      return respond(result);
    }
    if (action === "set") {
      const key = e.parameter.key;
      const value = e.parameter.value;
      const data = sheet.getDataRange().getValues();
      const idx = data.slice(1).findIndex(r => String(r[0]) === key);
      if (idx >= 0) {
        sheet.getRange(idx+2,2,1,2).setValues([[value, new Date().toISOString()]]);
      } else {
        sheet.appendRow([key, value, new Date().toISOString()]);
      }
      return respond({ ok: true });
    }
    if (action === "delete") {
      const key = e.parameter.key;
      const data = sheet.getDataRange().getValues();
      const idx = data.slice(1).findIndex(r => String(r[0]) === key);
      if (idx >= 0) sheet.deleteRow(idx + 2);
      return respond({ ok: true });
    }
    return respond({ error: "Unknown action" });
  } catch(err) {
    return respond({ error: err.toString() });
  }
}

function respond(data) {
  return ContentService
    .createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}`;

function dim(m){return new Date(CY,m+1,0).getDate();}
function dow(m,d){return new Date(CY,m,d).getDay();}
function bk(m,d,r){return `bk-${BY}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}-${r}`;}
function ok(s){return s&&s.customerName&&s.customerName.trim()!="";}
function norm(raw){
  if(!raw)return eSlots();
  const p=typeof raw==="string"?JSON.parse(raw):raw;
  if(Array.isArray(p)){const a=p.map(s=>({...ES,...s}));while(a.length<MS)a.push({...ES});return a;}
  return [{...ES,...p},{...ES},{...ES}];
}

let S={
  gasUrl:localStorage.getItem("gasUrl")||"",
  month:new Date().getMonth(),
  bookings:{},loading:false,
  modal:null,slots:eSlots(),activeSlot:0,saving:false,
  viewMode:"table",showSettings:false,deleteConfirm:false,
  testResult:null,testing:false,setupStep:1,setupUrl:"",copied:false
};
function ss(p){Object.assign(S,p);render();}

async function apiCall(params){
  const qs=new URLSearchParams(params).toString();
  const res=await fetch(S.gasUrl+"?"+qs,{redirect:"follow"});
  return res.json();
}
async function loadBk(){
  if(!S.gasUrl)return;
  ss({loading:true});
  try{
    const raw=await apiCall({action:"getAll",prefix:`bk-${BY}-`});
    const b={};
    for(const[k,v]of Object.entries(raw)){try{b[k]=norm(v);}catch{}}
    ss({bookings:b,loading:false});
  }catch(e){toast("โหลดข้อมูลไม่สำเร็จ: "+e.message,"err");ss({loading:false});}
}

function toast(msg,type){
  const t=document.createElement("div");
  t.className="toast";
  t.style.background=type==="err"?"#EF4444":"#16A34A";
  t.textContent=(type==="err"?"⚠️ ":"✅ ")+msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

function openModal(day,room){
  const key=bk(S.month,day,room);
  const slots=norm(S.bookings[key]||null);
  const fe=slots.findIndex(s=>!ok(s));
  ss({modal:{day,room,key},slots,activeSlot:fe>=0?fe:0,deleteConfirm:false});
}
function closeModal(){ss({modal:null,slots:eSlots(),deleteConfirm:false});}
function updField(field,val){
  const sl=[...S.slots];sl[S.activeSlot]={...sl[S.activeSlot],[field]:val};ss({slots:sl});
}
async function saveBk(){
  if(!S.slots.some(ok)){toast("กรุณากรอกชื่อลูกค้าอย่างน้อย 1 รายการ","err");return;}
  ss({saving:true});
  try{
    await apiCall({action:"set",key:S.modal.key,value:JSON.stringify(S.slots)});
    const b={...S.bookings,[S.modal.key]:[...S.slots]};
    toast(`บันทึกเรียบร้อย (${S.slots.filter(ok).length} รายการ)`);
    ss({bookings:b,saving:false});closeModal();
  }catch(e){toast("บันทึกไม่สำเร็จ: "+e.message,"err");ss({saving:false});}
}
async function clearSlot(){
  const sl=S.slots.map((s,i)=>i===S.activeSlot?{...ES}:s);
  ss({slots:sl,deleteConfirm:false});
  if(sl.every(s=>!ok(s))){
    try{
      await apiCall({action:"delete",key:S.modal.key});
      const b={...S.bookings};delete b[S.modal.key];
      toast("ลบข้อมูลเรียบร้อย");ss({bookings:b});closeModal();
    }catch(e){toast("ลบไม่สำเร็จ: "+e.message,"err");}
  }
}
async function testConnect(){
  if(!S.setupUrl.trim())return;
  ss({testing:true,testResult:null});
  const old=S.gasUrl;S.gasUrl=S.setupUrl.trim();
  try{
    const res=await apiCall({action:"getAll",prefix:"test-"});
    if(typeof res==="object"&&!res.error){
      localStorage.setItem("gasUrl",S.gasUrl);
      ss({testing:false,testResult:"ok"});
      setTimeout(()=>{ss({setupStep:1,setupUrl:""});loadBk();},800);
    }else{
      S.gasUrl=old;ss({testing:false,testResult:"error: "+(res.error||"เชื่อมต่อไม่ได้")});
    }
  }catch(e){S.gasUrl=old;ss({testing:false,testResult:"error: "+e.message});}
}
function resetUrl(){localStorage.removeItem("gasUrl");ss({gasUrl:"",bookings:{},showSettings:false,setupStep:1,setupUrl:""});}
async function copyCode(){
  try{await navigator.clipboard.writeText(GAS_CODE);ss({copied:true});setTimeout(()=>ss({copied:false}),2000);}catch{}
}

function h(tag,attr,ch){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attr||{})){
    if(k==="cls")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="st")Object.assign(e.style,v);
    else e.setAttribute(k,v);
  }
  for(const c of(ch||[])){if(c==null||c===false)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return e;
}
const d=(a,c)=>h("div",a,c);
const b=(a,c)=>h("button",a,c);
const sp=(a,c)=>h("span",a,c);

function renderSetup(){
  const s=S;
  const dot=(n)=>d({cls:"sdot",st:{background:s.setupStep>=n?"#6B3A2A":"#E5DDD5",color:s.setupStep>=n?"#fff":"#AAA"}},[String(n)]);
  const line=(a)=>d({cls:"sline",st:{background:a?"#6B3A2A":"#E5DDD5"}});

  let body;
  if(s.setupStep===1){
    body=d({},[
      h("h2",{st:{color:"#3D2B1F",fontSize:"18px",marginBottom:"8px"}},["ขั้นตอนที่ 1: สร้าง Google Sheet"]),
      h("p",{st:{color:"#666",fontSize:"14px",lineHeight:"1.7",marginBottom:"16px"},html:`
        1. เปิด <a href="https://sheets.google.com" target="_blank" style="color:#6B3A2A;font-weight:600">sheets.google.com</a> แล้วสร้าง Spreadsheet ใหม่<br/>
        2. ตั้งชื่อตามต้องการ เช่น <strong>"ตารางจองห้อง 2569"</strong><br/>
        3. คลิก <strong>Extensions → Apps Script</strong> ที่เมนูด้านบน<br/>
        4. ลบโค้ดเดิมออกทั้งหมด แล้วไปขั้นตอนถัดไป
      `},[]),
      d({st:{display:"flex",gap:"10px"}},[
        h("a",{href:"https://sheets.google.com/create",target:"_blank",st:{padding:"10px 20px",borderRadius:"8px",background:"#4A7C59",color:"#fff",textDecoration:"none",fontSize:"14px",fontWeight:"600"}},["📊 เปิด Google Sheets"]),
        b({cls:"btn btn-save",st:{background:"#6B3A2A"},onClick:()=>ss({setupStep:2})},["ถัดไป →"])
      ])
    ]);
  } else if(s.setupStep===2){
    const pre=h("pre",{cls:"codeblock"},[GAS_CODE]);
    const cpBtn=b({cls:"copybtn",st:{background:s.copied?"#4A7C59":"#45475A",color:"#fff"},onClick:copyCode},[s.copied?"✓ คัดลอกแล้ว!":"📋 คัดลอก"]);
    const codeWrap=d({st:{position:"relative",marginBottom:"16px"}},[pre,cpBtn]);
    body=d({},[
      h("h2",{st:{color:"#3D2B1F",fontSize:"18px",marginBottom:"8px"}},["ขั้นตอนที่ 2: วาง Script และ Deploy"]),
      h("p",{st:{color:"#666",fontSize:"14px",lineHeight:"1.7",marginBottom:"12px"},html:`
        1. คัดลอกโค้ดด้านล่าง แล้ววางใน Apps Script แทนโค้ดเดิม<br/>
        2. กด <strong>Save (Ctrl+S)</strong> → คลิก <strong>Run → getSheet</strong> เพื่อ Authorize<br/>
        3. คลิก <strong>Deploy → New deployment → Web app</strong><br/>
        4. Execute as: <strong>Me</strong> · Who has access: <strong>Anyone</strong><br/>
        5. คลิก <strong>Deploy</strong> แล้วคัดลอก URL ที่ได้
      `},[]),
      codeWrap,
      d({st:{display:"flex",gap:"10px"}},[
        b({cls:"btn btn-cancel",onClick:()=>ss({setupStep:1})},["← ย้อนกลับ"]),
        b({cls:"btn btn-save",st:{background:"#6B3A2A"},onClick:()=>ss({setupStep:3})},["Deploy แล้ว ถัดไป →"])
      ])
    ]);
  } else {
    const inp=h("input",{type:"text",value:s.setupUrl,placeholder:"https://script.google.com/macros/s/...",st:{width:"100%",padding:"10px 14px",borderRadius:"8px",border:"1px solid #E5DDD5",fontSize:"14px",boxSizing:"border-box",outline:"none"}});
    inp.addEventListener("input",e=>ss({setupUrl:e.target.value,testResult:null}));
    const tr=s.testResult?d({cls:"tres",st:{background:s.testResult==="ok"?"#DCFCE7":"#FEE2E2",color:s.testResult==="ok"?"#16A34A":"#DC2626"}},[(s.testResult==="ok"?"✅ เชื่อมต่อสำเร็จ! กำลังเปิดโปรแกรม...":"⚠️ "+s.testResult)]):null;
    body=d({},[
      h("h2",{st:{color:"#3D2B1F",fontSize:"18px",marginBottom:"8px"}},["ขั้นตอนที่ 3: ใส่ Web App URL"]),
      h("p",{st:{color:"#666",fontSize:"14px",marginBottom:"16px"}},["วาง URL ที่ได้จากการ Deploy Apps Script ด้านล่าง"]),
      d({cls:"field"},[h("label",{},["Web App URL"]),inp]),
      tr,
      d({st:{display:"flex",gap:"10px"}},[
        b({cls:"btn btn-cancel",onClick:()=>ss({setupStep:2})},["← ย้อนกลับ"]),
        b({cls:"btn btn-save",st:{background:s.testing||!s.setupUrl.trim()?"#AAA":"#6B3A2A",flex:"1"},onClick:testConnect,disabled:s.testing||!s.setupUrl.trim()},[s.testing?"⏳ กำลังทดสอบ...":"🔗 ทดสอบและเชื่อมต่อ"])
      ])
    ]);
  }

  return d({cls:"setup"},[
    d({st:{width:"100%",maxWidth:"620px"}},[
      d({st:{textAlign:"center",marginBottom:"32px"}},[
        d({st:{fontSize:"40px",marginBottom:"8px"}},["🗓️"]),
        h("h1",{st:{fontFamily:"'Playfair Display',serif",color:"#3D2B1F",fontSize:"24px"}},["ตั้งค่าระบบจองห้องประชุม"]),
        h("p",{st:{color:"#888",marginTop:"8px",fontSize:"15px"}},["เชื่อมต่อกับ Google Sheets เพื่อให้ข้อมูลซิงค์ได้จากทุกอุปกรณ์"])
      ]),
      d({cls:"stepbar"},[dot(1),line(s.setupStep>1),dot(2),line(s.setupStep>2),dot(3)]),
      d({cls:"scard-setup"},[body]),
      h("p",{st:{textAlign:"center",color:"#BBB",fontSize:"12px",marginTop:"16px"}},["ตั้งค่าครั้งเดียว ข้อมูลซิงค์ทุกอุปกรณ์ผ่าน Google Sheets ของคุณ"])
    ])
  ]);
}

function renderApp(){
  const s=S;
  const days=dim(s.month);
  const mc=ROOMS.map(room=>{let c=0;for(let d=1;d<=days;d++){const b=s.bookings[bk(s.month,d,room)];if(b&&b.some(ok))c++;}return c;});

  const header=d({cls:"header"},[
    d({cls:"hinner"},[
      d({cls:"htop"},[
        d({},[
          d({cls:"hsub"},["ระบบจองห้องประชุม · Google Sheets"]),
          h("h1",{cls:"htitle"},[`ตารางรับจองห้องประชุม พ.ศ. ${BY}`])
        ]),
        d({cls:"hbtns"},[
          b({cls:"hbtn "+(s.viewMode==="table"?"act":"inact"),onClick:()=>ss({viewMode:"table"})},["📅 ตาราง"]),
          b({cls:"hbtn "+(s.viewMode==="list"?"act":"inact"),onClick:()=>ss({viewMode:"list"})},["📋 รายการ"]),
          b({cls:"hbtn out",onClick:()=>ss({showSettings:true})},["⚙️ ตั้งค่า"])
        ])
      ]),
      d({cls:"pills"},ROOMS.map((r,i)=>d({cls:"pill",st:{borderLeft:`3px solid ${RC[i]}`}},[d({cls:"pill-n"},[r]),d({cls:"pill-c"},[`จอง ${mc[i]} วัน`])])))
    ])
  ]);

  const mtabs=d({cls:"mtabs"},[
    d({cls:"mtabs-in"},MSH.map((m,i)=>b({cls:"mtab"+(s.month===i?" act":""),onClick:()=>{ss({month:i});setTimeout(loadBk,10);}},[m])))
  ]);

  let content;
  if(s.loading){
    content=d({st:{textAlign:"center",padding:"60px",color:"#999"}},[d({st:{fontSize:"28px",marginBottom:"8px"}},["⏳"]),"กำลังโหลดข้อมูลจาก Google Sheets..."]);
  } else if(s.viewMode==="table"){
    content=renderTable(s,days);
  } else {
    content=renderList(s,days);
  }

  const main=d({cls:"main"},[
    d({cls:"main-top"},[
      h("h2",{cls:"main-ttl"},[`${MTH[s.month]} ${BY}`]),
      d({cls:"main-hint"},["คลิกช่องเพื่อเพิ่ม/แก้ไขการจอง · สูงสุด 3 รายการ/ห้อง/วัน"])
    ]),
    content
  ]);

  const modal=s.modal?renderModal(s):null;
  const settings=s.showSettings?renderSettings():null;
  return d({},[header,mtabs,main,modal,settings].filter(Boolean));
}

function renderTable(s,days){
  const thead=h("thead",{},[
    h("tr",{},[
      h("th",{cls:"dcol"},["วันที่"]),
      ...ROOMS.map((r,i)=>h("th",{st:{borderLeft:`3px solid ${RC[i]}`}},[r]))
    ])
  ]);
  const rows=[];
  for(let day=1;day<=days;day++){
    const dw=dow(s.month,day);
    const bg=dw===0?"#FFF5F5":dw===6?"#F5F8FF":day%2===0?"#FAFAF8":"#fff";
    const cells=[
      h("td",{cls:"dcell"},[
        d({cls:"dnum",st:{color:DC[dw]||"#3D2B1F"}},[String(day)]),
        d({cls:"dname",st:{color:DC[dw]||"#BBB"}},[DSH[dw]])
      ])
    ];
    ROOMS.forEach((room,ri)=>{
      const bkd=s.bookings[bk(s.month,day,room)];
      const filled=bkd?bkd.filter(ok):[];
      const cc=filled.length>0?[
        ...filled.map(sl=>{
          const oi=bkd.indexOf(sl);
          return d({cls:"scard",st:{background:RL[ri],borderLeft:`3px solid ${SB[oi]||RC[ri]}`}},[
            d({cls:"scard-h"},[sp({cls:"sbadge",st:{background:SB[oi]||RC[ri]}},[String(oi+1)]),sp({cls:"sname",st:{color:RC[ri]}},[sl.customerName])]),
            sl.eventName?d({cls:"sevent"},[sl.eventName]):null,
            (sl.timeStart||sl.pax)?d({cls:"stime"},[(sl.timeStart?`🕐${sl.timeStart}${sl.timeEnd?"-"+sl.timeEnd:""}`:"")+(sl.pax?` · ${sl.pax}คน`:"")]):null
          ].filter(Boolean));
        }),
        filled.length<MS?d({cls:"mh"},["+ เพิ่ม"]):null
      ].filter(Boolean):[d({cls:"ah"},["+ เพิ่ม"])];

      const td=h("td",{cls:"rcell",st:{borderLeft:`2px solid ${RC[ri]}22`},onClick:()=>openModal(day,room)},cc);
      td.addEventListener("mouseenter",()=>td.style.background=RL[ri]);
      td.addEventListener("mouseleave",()=>td.style.background="transparent");
      cells.push(td);
    });
    rows.push(h("tr",{st:{background:bg}},cells));
  }
  return d({cls:"twrap"},[h("table",{},[thead,h("tbody",{},rows)])]);
}

function renderList(s,days){
  const items=[];
  for(let dd=1;dd<=days;dd++){
    ROOMS.forEach((room,ri)=>{
      const bkd=s.bookings[bk(s.month,dd,room)];
      if(bkd&&bkd.some(ok))items.push({day:dd,room,ri,bkd});
    });
  }
  if(!items.length)return d({cls:"empty"},[d({st:{fontSize:"40px",marginBottom:"12px"}},["📭"]),"ยังไม่มีการจองในเดือนนี้"]);
  return d({cls:"lwrap"},items.map(({day,room,ri,bkd})=>{
    const dw=dow(s.month,day);
    const card=d({cls:"lcard",st:{borderLeft:`4px solid ${RC[ri]}`},onClick:()=>openModal(day,room)},[
      d({cls:"lday"},[
        d({cls:"ldnum",st:{color:DC[dw]||"#3D2B1F"}},[String(day)]),
        d({cls:"ldname",st:{color:DC[dw]||"#999"}},[DTH[dw]])
      ]),
      d({st:{flex:"1"}},[
        d({cls:"lrtitle",st:{color:RC[ri]}},[`${room} · ${bkd.filter(ok).length} รายการ`]),
        d({cls:"lslots"},bkd.map((sl,i)=>{
          if(!ok(sl))return null;
          return d({cls:"lslot",st:{background:RL[ri],borderLeft:`3px solid ${SB[i]}`}},[
            sp({cls:"lsbadge",st:{background:SB[i]}},[String(i+1)]),
            d({},[
              d({st:{fontWeight:"700",fontSize:"14px",color:"#3D2B1F"}},[sl.customerName]),
              sl.eventName?d({st:{color:"#666",fontSize:"12px"}},[sl.eventName]):null,
              d({st:{display:"flex",gap:"10px",marginTop:"2px",flexWrap:"wrap"}},[
                sl.timeStart?sp({st:{fontSize:"12px",color:"#888"}},[`🕐 ${sl.timeStart}${sl.timeEnd?"-"+sl.timeEnd:""}`]):null,
                sl.pax?sp({st:{fontSize:"12px",color:"#888"}},[`👥 ${sl.pax} คน`]):null,
                sl.note?sp({st:{fontSize:"12px",color:"#888"}},[`📝 ${sl.note}`]):null
              ].filter(Boolean))
            ])
          ].filter(Boolean));
        }).filter(Boolean))
      ])
    ]);
    card.addEventListener("mouseenter",()=>card.style.boxShadow="0 4px 16px rgba(0,0,0,.12)");
    card.addEventListener("mouseleave",()=>card.style.boxShadow="0 2px 8px rgba(0,0,0,.07)");
    return card;
  }));
}

function renderModal(s){
  const ri=ROOMS.indexOf(s.modal.room);
  const rc=RC[ri];
  const cur=s.slots[s.activeSlot]||{...ES};
  const fc=s.slots.filter(ok).length;

  function field(label,fd,type,ph,multi){
    const inp=multi?h("textarea",{rows:"2",placeholder:ph||""},null):h("input",{type:type||"text",placeholder:ph||""},null);
    inp.value=cur[fd]||"";
    inp.addEventListener("input",e=>updField(fd,e.target.value));
    inp.addEventListener("focus",()=>inp.style.borderColor="#8B5E3C");
    inp.addEventListener("blur",()=>inp.style.borderColor="#E5DDD5");
    return d({cls:"field"},[h("label",{},[label]),inp]);
  }

  const tabs=s.slots.map((sl,i)=>{
    const f=ok(sl),ia=s.activeSlot===i;
    const t=b({cls:"stab",st:{background:ia?"#fff":"rgba(255,255,255,.2)",color:ia?rc:"rgba(255,255,255,.85)",fontWeight:ia?"700":"500"},onClick:()=>ss({activeSlot:i,deleteConfirm:false})},[
      sp({cls:"stdot",st:{background:f?(ia?SB[i]:"rgba(255,255,255,.35)"):"transparent",color:f?"#fff":(ia?rc:"rgba(255,255,255,.6)"),border:f?"none":`1.5px solid ${ia?rc+"99":"rgba(255,255,255,.5)"}`}},[String(i+1)]),
      `รายการที่ ${i+1}`,f?" ✓":""
    ]);
    return t;
  });

  const sum=fc>0?d({cls:"sumbox"},[
    d({cls:"sumttl"},[`📋 สรุปการจองวันนี้ (${fc}/${MS})`]),
    ...s.slots.map((sl,i)=>{
      if(!ok(sl))return null;
      const row=d({cls:"sumrow",st:{background:s.activeSlot===i?RL[ri]:"transparent"},onClick:()=>ss({activeSlot:i})},[
        sp({cls:"sumbadge",st:{background:SB[i]}},[String(i+1)]),
        sp({st:{fontSize:"13px",color:"#3D2B1F",fontWeight:"600",flex:"1"}},[sl.customerName]),
        sl.timeStart?sp({st:{fontSize:"11px",color:"#999"}},[sl.timeStart+(sl.timeEnd?"-"+sl.timeEnd:"")]):null,
        sl.pax?sp({st:{fontSize:"11px",color:"#999"}},[sl.pax+"คน"]):null
      ].filter(Boolean));
      return row;
    }).filter(Boolean)
  ]):null;

  const delSec=ok(cur)?
    (!s.deleteConfirm?
      b({cls:"btn-del",onClick:()=>ss({deleteConfirm:true})},[`🗑 ลบรายการที่ ${s.activeSlot+1}`]):
      d({cls:"dconf"},[
        sp({},[" ยืนยันลบ?"]),
        b({cls:"dconf-yes",onClick:clearSlot},["ยืนยัน"]),
        b({cls:"dconf-no",onClick:()=>ss({deleteConfirm:false})},["ยกเลิก"])
      ])
    ):null;

  const ov=d({cls:"overlay",onClick:(e)=>{if(e.target===ov)closeModal();}},[
    d({cls:"modal"},[
      d({cls:"mhead",st:{background:`linear-gradient(135deg,${rc},${rc}BB)`}},[
        d({cls:"mdate"},[`${s.modal.day} ${MTH[s.month]} ${BY}`]),
        d({cls:"mroom"},[s.modal.room]),
        d({cls:"stabs"},tabs)
      ]),
      d({cls:"mbody"},[
        field("ชื่อลูกค้า / องค์กร *","customerName","text","กรอกชื่อลูกค้าหรือองค์กร"),
        field("ชื่องาน / รายการ","eventName","text","เช่น ประชุมบอร์ด, สัมมนา"),
        d({cls:"frow"},[field("เวลาเริ่ม","timeStart","time"),field("เวลาสิ้นสุด","timeEnd","time"),field("จำนวนคน","pax","number","0")]),
        field("หมายเหตุ","note","text","ข้อมูลเพิ่มเติม",true),
        sum,
        d({cls:"mfooter"},[
          d({},[delSec].filter(Boolean)),
          d({st:{display:"flex",gap:"10px"}},[
            b({cls:"btn btn-cancel",onClick:closeModal},["ยกเลิก"]),
            b({cls:"btn btn-save",st:{background:rc,opacity:s.saving?.7:1},onClick:saveBk,disabled:s.saving},[s.saving?"⏳ กำลังบันทึก...":"💾 บันทึกทั้งหมด"])
          ])
        ])
      ])
    ])
  ]);
  return ov;
}

function renderSettings(){
  const ov=d({cls:"overlay",onClick:(e)=>{if(e.target===ov)ss({showSettings:false});}},[
    d({cls:"settbox"},[
      h("h3",{st:{marginBottom:"16px",color:"#3D2B1F"}},["⚙️ ตั้งค่าระบบ"]),
      h("p",{st:{color:"#666",fontSize:"14px"}},["ข้อมูลถูกเชื่อมต่อกับ Google Sheets แล้ว"]),
      d({st:{display:"flex",gap:"10px",marginTop:"20px"}},[
        b({cls:"btn btn-cancel",st:{flex:"1"},onClick:()=>ss({showSettings:false})},["ปิด"]),
        b({cls:"btn btn-save",st:{flex:"1",background:"#EF4444"},onClick:resetUrl},["🔄 เปลี่ยน URL ใหม่"])
      ])
    ])
  ]);
  return ov;
}

function render(){
  const root=document.getElementById("app");
  root.innerHTML="";
  root.appendChild(S.gasUrl?renderApp():renderSetup());
}

render();
if(S.gasUrl)loadBk();
</script>
